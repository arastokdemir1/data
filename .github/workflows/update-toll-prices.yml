name: Update toll prices

on:
  workflow_dispatch:          # Manuel tetikle
  schedule:
    - cron: "0 3 * * 1"      # Her Pazartesi 03:00 UTC (KGM fiyatları genelde Ocak'ta değişir, haftalık kontrol yeterli)

permissions:
  contents: write

concurrency:
  # Both pricing writers target main; serialize them across workflows.
  group: pricing-data-write
  cancel-in-progress: false

jobs:
  update-toll-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRICING_MANIFEST_PUBLIC_KEY: ${{ vars.PRICING_MANIFEST_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pdfplumber cryptography==47.0.0 -q

      - name: Run fixture regression tests
        run: python -m unittest discover -s tests -v

      - name: Run toll price updater
        # continue-on-error KALDIRILDI: script zaten "gerçek scrape hatası" (exit 1)
        # ile "bu hafta fiyat değişmedi" (exit 0) durumunu ayırt ediyor. Maskeleme
        # yalnızca gerçek hataları gizliyordu — haftalarca sessizce hiç veri
        # güncellemeden yeşil görünmesine yol açtı (CarLog gişe bug'ının kök nedeni).
        run: python scripts/update_toll_prices.py --root .

      - name: Sign pricing manifest
        env:
          PRICING_MANIFEST_SIGNING_KEY: ${{ secrets.PRICING_MANIFEST_SIGNING_KEY }}
        run: python scripts/sign_pricing_manifest.py --root .

      - name: Validate complete toll pricing data
        run: |
          python scripts/validate_pricing_data.py --root . --require-tolls --require-signature

      - name: Commit verified toll prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tolls_v3_app_ready.json toll_matrix_tr_v1.json pricing_manifest.json
          if git diff --cached --quiet; then
            echo "No verified toll-price change to commit."
          else
            git commit -m "Update verified toll prices"
            git push
          fi
