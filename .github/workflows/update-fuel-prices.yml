name: Update pricing data

on:
  workflow_dispatch:
  schedule:
    # GitHub scheduled workflows are best-effort. This requests two runs per
    # hour, but the manifest deliberately does not promise a fixed cadence.
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  # Both pricing writers target main; serialize them across workflows.
  group: pricing-data-write
  cancel-in-progress: false

jobs:
  update-pricing-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRICING_MANIFEST_PUBLIC_KEY: ${{ vars.PRICING_MANIFEST_PUBLIC_KEY }}
    steps:
      - name: Checkout data repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install fixture test dependencies
        run: pip install requests beautifulsoup4 pdfplumber cryptography==47.0.0 -q

      - name: Run fixture regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Generate dynamic pricing JSON
        run: python3 scripts/update_all_pricing_data.py --root .

      - name: Sign pricing manifest
        env:
          PRICING_MANIFEST_SIGNING_KEY: ${{ secrets.PRICING_MANIFEST_SIGNING_KEY }}
        run: python3 scripts/sign_pricing_manifest.py --root .

      - name: Validate generated pricing data
        run: |
          python3 scripts/validate_pricing_data.py --root . --require-fuel --require-signature

      - name: Commit verified pricing data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuel_prices.json fuel_prices_tr_v1.json pricing_manifest.json
          if git diff --cached --quiet; then
            echo "No verified fuel-price change to commit."
          else
            git commit -m "Update verified pricing data"
            git push
          fi
