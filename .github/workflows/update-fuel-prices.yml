name: Update pricing data

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: update-pricing-data
  cancel-in-progress: false

jobs:
  update-pricing-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout data repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fixture test dependencies
        run: pip install requests beautifulsoup4 pdfplumber -q

      - name: Run fixture regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Generate dynamic pricing JSON
        run: python3 scripts/update_all_pricing_data.py --root .

      - name: Validate generated pricing data
        run: |
          python3 scripts/validate_pricing_data.py --root . --require-fuel

      - name: Commit changed pricing data files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update pricing data"
          file_pattern: fuel_prices.json fuel_prices_tr_v1.json pricing_manifest.json
